# ==============================================================================
# mac_registration, SCENE profile (a keyframe of the surroundings; localisation prior)
# Same keys as params.yaml; only the scale-dependent values differ.
# ==============================================================================
mac_registration:
  ros__parameters:
    label: "scene"
    intensity_mode: "all"
    reference_dir: "~/.ros/mac_registration"

    auto_capture: true
    capture_min_points: 2000
    capture_min_extent: 0.5
    capture_max_extent: 20.0
    capture_stability_frames: 3
    capture_centroid_tolerance: 0.01
    capture_warmup_frames: 15

    voxel_size: 0.02
    point_resolution: 0.0
    normal_radius: 0.0
    fpfh_radius: 0.0
    keypoints: "none"
    max_keypoints: 2000
    mutual_matching: true
    max_correspondences: 1000
    min_correspondences: 10
    random_seed: 42

    mac:
      use_sog: true
      evaluation_metric: "MAE"
      t_cmp: 0.99
      d_cmp_pr: 10.0
      inlier_thresh_pr: 10.0
      min_clique_size: 3
      clique_ranking: false
      top_k: 100
      refinement_iterations: 20
      max_graph_edges: 150000
      max_cliques: 20000

    icp:
      enable: true
      max_corr_dist: 0.0
      max_iterations: 30
    fitness_radius: 0.0

    gate:
      min_inliers: 20
      max_mae: 0.04                  # [m] ~2 x voxel
      min_fitness: 0.3

    publish_tf: false
    tf_child_frame: ""
    publish_aligned_cloud: true
    publish_diagnostics: true
    num_threads: 0
    warn_throttle_sec: 2.0
